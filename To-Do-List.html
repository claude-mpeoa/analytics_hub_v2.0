<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Tasks: Live Drag & Detail</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .custom-shadow { box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.02); }
        .task-card { transition: transform 0.2s, opacity 0.2s; cursor: default; }
        .dragging { opacity: 0.5; transform: scale(0.98); }
        .drag-over { border-top: 4px solid #4f46e5; }
        
        /* Custom scrollbar for long task text in modal */
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-2xl mx-auto">
        <header class="mb-8 flex flex-col md:flex-row md:items-end justify-between gap-4">
            <div>
                <div class="flex items-center gap-2 mb-1">
                    <span class="h-2.5 w-2.5 rounded-full bg-emerald-500 animate-ping"></span>
                    <span class="text-[10px] font-bold tracking-wider text-emerald-600 uppercase">Live Real-Time Sync</span>
                </div>
                <h1 class="text-3xl font-bold text-slate-900 tracking-tight">Timeline Workspace</h1>
                <p id="date-text" class="text-slate-500 font-medium"></p>
            </div>
            
            <div class="flex flex-col items-end gap-2">
                <!-- Workspace Selector -->
                <div class="flex items-center gap-2 bg-white p-1 rounded-xl border border-slate-200 shadow-sm">
                    <input type="text" id="workspace-input" 
                        class="px-3 py-1 text-sm font-semibold text-slate-700 outline-none w-32 md:w-40" 
                        placeholder="Workspace Name">
                    <button onclick="switchWorkspace()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1 rounded-lg text-xs font-bold transition-all">LOAD</button>
                </div>
                
                <div id="sync-status" class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-100 text-[10px] font-bold uppercase tracking-wider text-slate-500 transition-all">
                    <div class="h-2 w-2 rounded-full bg-slate-300 status-dot"></div>
                    <span class="status-text">Connecting...</span>
                </div>
            </div>
        </header>

        <div class="relative mb-8 group">
            <textarea id="task-input" rows="1"
                class="w-full p-5 pr-16 bg-white rounded-2xl border border-slate-200 focus:ring-4 focus:ring-indigo-100 focus:border-indigo-500 outline-none transition-all text-slate-700 placeholder-slate-400 custom-shadow resize-none overflow-hidden"
                placeholder="What needs to be done? (Shift+Enter for new line)"
                oninput="this.style.height = '';this.style.height = this.scrollHeight + 'px'"></textarea>
            <button id="add-btn" class="absolute right-3 bottom-3 h-11 w-11 bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 transition-all flex items-center justify-center shadow-lg shadow-indigo-200">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4" />
                </svg>
            </button>
        </div>

        <!-- Active Tasks Header -->
        <div class="flex items-center justify-between mb-3 px-1">
            <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">Active Goals</h2>
            <span id="active-count" class="text-xs font-bold px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-600">0</span>
        </div>

        <div id="task-list" class="space-y-3 mb-8">
            <!-- Active Tasks appear here -->
        </div>

        <!-- Completed Section -->
        <div class="border-t border-slate-100 pt-6">
            <button onclick="toggleCompletedSection()" class="flex items-center justify-between w-full mb-4 px-1 group text-left">
                <div class="flex items-center gap-2">
                    <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 group-hover:text-slate-600 transition-colors">Completed History</h2>
                    <span id="completed-count" class="text-xs font-bold px-2 py-0.5 rounded-full bg-slate-100 text-slate-500">0</span>
                </div>
                <span id="toggle-icon" class="text-slate-400 group-hover:text-slate-600 transition-colors text-xs font-bold">SHOW</span>
            </button>
            <div id="completed-task-list" class="space-y-3 hidden opacity-75">
                <!-- Completed Tasks appear here -->
            </div>
        </div>

        <div id="empty-state" class="hidden py-12 text-center">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-slate-100 mb-4 text-slate-400">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                </svg>
            </div>
            <p class="text-slate-400 font-medium">Your timeline is clear.</p>
        </div>
    </div>

    <!-- Detail Modal -->
    <div id="detail-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-lg overflow-hidden shadow-2xl animate-in fade-in zoom-in duration-200">
            <div class="p-6 md:p-8">
                <div class="flex justify-between items-start mb-6">
                    <h2 class="text-xs font-bold text-indigo-600 uppercase tracking-widest">Task Details</h2>
                    <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>
                
                <div id="modal-content" class="space-y-6">
                    <div class="max-h-64 overflow-y-auto custom-scroll pr-2">
                        <p id="modal-text" class="text-slate-800 text-lg font-medium leading-relaxed whitespace-pre-wrap"></p>
                    </div>
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-6 border-t border-slate-100">
                        <div class="bg-slate-50 p-3 rounded-2xl">
                            <span class="block text-[10px] font-bold text-slate-400 uppercase tracking-tighter">Created</span>
                            <span id="modal-created" class="text-sm font-semibold text-slate-600 italic"></span>
                        </div>
                        <div id="modal-done-container" class="bg-emerald-50 p-3 rounded-2xl hidden">
                            <span class="block text-[10px] font-bold text-emerald-400 uppercase tracking-tighter">Completed</span>
                            <span id="modal-completed" class="text-sm font-semibold text-emerald-600 italic"></span>
                        </div>
                        <div id="modal-updated-container" class="bg-indigo-50 p-3 rounded-2xl col-span-full hidden">
                            <span class="block text-[10px] font-bold text-indigo-400 uppercase tracking-tighter">Last Edited</span>
                            <span id="modal-updated" class="text-sm font-semibold text-indigo-600 italic"></span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="bg-slate-50 p-4 px-8 flex justify-end">
                <button onclick="closeModal()" class="px-6 py-2 bg-slate-900 text-white rounded-xl font-bold text-sm hover:bg-slate-800 transition-all">Close</button>
            </div>
        </div>
    </div>

    <!-- Firestore Integration script imports -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global Variables
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'live-tasks-workspace';
        const firebaseConfig = {
            apiKey: "AIzaSyAB0y4HrWYWJDgDdOu1n4IRIAN7I6u3ZnA",
            authDomain: "hub-datastore.firebaseapp.com",
            projectId: "hub-datastore",
            storageBucket: "hub-datastore.firebasestorage.app",
            messagingSenderId: "506609110569",
            appId: "1:506609110569:web:a1cccc7bea50a47f061638"
            };
        
        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let tasks = [];
        let currentWorkspace = localStorage.getItem('active_workspace') || 'Personal-Workspace';
        let draggedItemIndex = null;
        let currentUser = null;
        let showCompleted = false;
        let activeSubscriptionUnsubscribe = null;

        const input = document.getElementById('task-input');
        const workspaceInput = document.getElementById('workspace-input');
        const listContainer = document.getElementById('task-list');
        const completedContainer = document.getElementById('completed-task-list');
        const emptyState = document.getElementById('empty-state');
        const statusText = document.querySelector('.status-text');
        const statusDot = document.querySelector('.status-dot');

        workspaceInput.value = currentWorkspace;
        document.getElementById('date-text').innerText = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });

        // Stream Status Manager
        function updateStatus(state, text) {
            statusText.innerText = text;
            statusDot.className = `h-2 w-2 rounded-full transition-all duration-500 status-dot`;
            if (state === 'syncing') statusDot.classList.add('bg-amber-400', 'animate-pulse');
            else if (state === 'online') statusDot.classList.add('bg-emerald-500');
            else if (state === 'error') statusDot.classList.add('bg-red-500');
            else statusDot.classList.add('bg-slate-300');
        }

        // Setup real-time Firestore Subscription
        function setupLiveSync() {
            if (!currentUser) return;
            
            // Unsubscribe from any previous live listeners
            if (activeSubscriptionUnsubscribe) {
                activeSubscriptionUnsubscribe();
            }

            updateStatus('syncing', 'Connecting Live...');

            // Strict collection path matching RULE 1
            const workspaceDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'workspaces', currentWorkspace);

            // Fetch live changes in real-time
            activeSubscriptionUnsubscribe = onSnapshot(workspaceDocRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    tasks = data.tasks || [];
                } else {
                    tasks = [];
                }
                renderTasks();
                updateStatus('online', 'Live Connected');
            }, (error) => {
                console.error("Firestore live-sync error:", error);
                updateStatus('error', 'Sync Disconnected');
            });
        }

        // Save modifications up to Firestore
        async function saveToCloud() {
            if (!currentUser) return;
            updateStatus('syncing', 'Syncing...');
            try {
                const workspaceDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'workspaces', currentWorkspace);
                await setDoc(workspaceDocRef, { tasks: tasks }, { merge: true });
                updateStatus('online', 'Live Connected');
            } catch (err) {
                console.error("Cloud save failed:", err);
                updateStatus('error', 'Save Failed');
            }
        }

        // Render Active & Completed Lists cleanly
        window.renderTasks = function renderTasks() {
            listContainer.innerHTML = '';
            completedContainer.innerHTML = '';
            
            const activeTasks = tasks.filter(t => !t.completed);
            const completedTasks = tasks.filter(t => t.completed);

            document.getElementById('active-count').innerText = activeTasks.length;
            document.getElementById('completed-count').innerText = completedTasks.length;

            if (tasks.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }
            emptyState.classList.add('hidden');

            // Render Active Tasks
            activeTasks.forEach((task) => {
                const index = tasks.findIndex(t => t.id === task.id);
                const el = document.createElement('div');
                el.draggable = true;
                el.className = `task-card group flex items-start gap-3 p-4 bg-white border border-slate-100 rounded-2xl custom-shadow`;
                
                el.addEventListener('dragstart', () => handleDragStart(index));
                el.addEventListener('dragover', (e) => handleDragOver(e, el));
                el.addEventListener('drop', () => handleDrop(index));
                el.addEventListener('dragend', handleDragEnd);

                const createdDate = new Date(task.createdAt).toLocaleDateString([], { month: 'short', day: 'numeric' });

                el.innerHTML = `
                    <div class="mt-1.5 cursor-grab active:cursor-grabbing text-slate-300 hover:text-slate-400">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8h16M4 16h16" />
                        </svg>
                    </div>
                    <div class="mt-1 cursor-pointer flex-shrink-0" onclick="toggleTask(${index})">
                        <div class="h-6 w-6 rounded-lg border-2 flex items-center justify-center transition-all border-slate-200 hover:border-indigo-400">
                        </div>
                    </div>
                    <div class="flex-1 min-w-0 cursor-pointer" onclick="openDetail(${index})">
                        <p class="text-slate-700 font-semibold leading-tight break-words">
                            ${escapeHTML(task.text)}
                        </p>
                        <div class="flex items-center gap-2 mt-2">
                            <span class="text-[9px] font-bold uppercase tracking-wider text-slate-400 bg-slate-100 px-2 py-0.5 rounded-md">${createdDate}</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-1">
                         <button onclick="deleteTask(${index}, event)" class="text-slate-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-all p-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                            </svg>
                        </button>
                    </div>
                `;
                listContainer.appendChild(el);
            });

            // Render Completed Tasks
            completedTasks.forEach((task) => {
                const index = tasks.findIndex(t => t.id === task.id);
                const el = document.createElement('div');
                el.className = `task-card flex items-start gap-3 p-4 bg-slate-50/50 border border-slate-100 rounded-2xl custom-shadow`;
                
                const completedDate = new Date(task.completedAt).toLocaleDateString([], { month: 'short', day: 'numeric' });

                el.innerHTML = `
                    <div class="w-5 flex-shrink-0"></div> <!-- spacing matching drag handle -->
                    <div class="mt-1 cursor-pointer flex-shrink-0" onclick="toggleTask(${index})">
                        <div class="h-6 w-6 rounded-lg border-2 flex items-center justify-center transition-all bg-indigo-600 border-indigo-600 shadow-sm">
                            <svg class="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M5 13l4 4L19 7"></path></svg>
                        </div>
                    </div>
                    <div class="flex-1 min-w-0 cursor-pointer" onclick="openDetail(${index})">
                        <p class="text-slate-400 font-semibold leading-tight break-words line-through">
                            ${escapeHTML(task.text)}
                        </p>
                        <div class="flex items-center gap-2 mt-2">
                            <span class="text-[9px] font-bold uppercase tracking-wider text-emerald-500 bg-emerald-50 px-2 py-0.5 rounded-md">Completed ${completedDate}</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-1">
                         <button onclick="deleteTask(${index}, event)" class="text-slate-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-all p-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                            </svg>
                        </button>
                    </div>
                `;
                completedContainer.appendChild(el);
            });
        }

        // Task operations
        window.addTask = function addTask() {
            const val = input.value.trim();
            if (val) {
                const now = new Date().toISOString();
                tasks.unshift({ 
                    text: val, 
                    completed: false, 
                    id: Date.now().toString(),
                    createdAt: now,
                    updatedAt: now,
                    completedAt: null 
                });
                input.value = '';
                input.style.height = 'auto';
                renderTasks();
                saveToCloud();
            }
        }

        window.toggleTask = function toggleTask(index) {
            const now = new Date().toISOString();
            tasks[index].completed = !tasks[index].completed;
            tasks[index].updatedAt = now;
            tasks[index].completedAt = tasks[index].completed ? now : null;
            renderTasks();
            saveToCloud();
        }

        window.deleteTask = function deleteTask(index, event) {
            event.stopPropagation();
            tasks.splice(index, 1);
            renderTasks();
            saveToCloud();
        }

        window.switchWorkspace = function switchWorkspace() {
            const newWs = workspaceInput.value.trim();
            if (newWs) {
                currentWorkspace = newWs;
                localStorage.setItem('active_workspace', newWs);
                setupLiveSync();
            }
        }

        window.toggleCompletedSection = function toggleCompletedSection() {
            showCompleted = !showCompleted;
            const container = document.getElementById('completed-task-list');
            const icon = document.getElementById('toggle-icon');
            if (showCompleted) {
                container.classList.remove('hidden');
                icon.innerText = "HIDE";
            } else {
                container.classList.add('hidden');
                icon.innerText = "SHOW";
            }
        }

        // Drag and Drop ordering handlers
        function handleDragStart(index) {
            draggedItemIndex = index;
            setTimeout(() => {
                document.querySelectorAll('.task-card')[index].classList.add('dragging');
            }, 0);
        }

        function handleDragOver(e, el) {
            e.preventDefault();
            const cards = document.querySelectorAll('#task-list .task-card');
            cards.forEach(c => c.classList.remove('drag-over'));
            el.classList.add('drag-over');
        }

        function handleDrop(index) {
            if (draggedItemIndex === null || draggedItemIndex === index) return;
            const itemToMove = tasks.splice(draggedItemIndex, 1)[0];
            tasks.splice(index, 0, itemToMove);
            renderTasks();
            saveToCloud();
        }

        function handleDragEnd() {
            draggedItemIndex = null;
            document.querySelectorAll('.task-card').forEach(c => {
                c.classList.remove('dragging', 'drag-over');
            });
        }

        // Modal viewing handlers
        window.openDetail = function openDetail(index) {
            const task = tasks[index];
            document.getElementById('modal-text').innerText = task.text;
            document.getElementById('modal-created').innerText = new Date(task.createdAt).toLocaleString();
            
            const doneBox = document.getElementById('modal-done-container');
            if (task.completedAt) {
                doneBox.classList.remove('hidden');
                document.getElementById('modal-completed').innerText = new Date(task.completedAt).toLocaleString();
            } else {
                doneBox.classList.add('hidden');
            }

            const updateBox = document.getElementById('modal-updated-container');
            if (task.updatedAt && task.updatedAt !== task.createdAt) {
                updateBox.classList.remove('hidden');
                document.getElementById('modal-updated').innerText = new Date(task.updatedAt).toLocaleString();
            } else {
                updateBox.classList.add('hidden');
            }

            document.getElementById('detail-modal').classList.remove('hidden');
        }

        window.closeModal = function closeModal() {
            document.getElementById('detail-modal').classList.add('hidden');
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        // Initialize authorization according to RULE 3
        async function runAuthenticationFlow() {
            updateStatus('syncing', 'Authenticating...');
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    const credentials = await signInWithCustomToken(auth, __initial_auth_token);
                    currentUser = credentials.user;
                } else {
                    const credentials = await signInAnonymously(auth);
                    currentUser = credentials.user;
                }
                console.log("Authorized Session ID:", currentUser.uid);
                setupLiveSync();
            } catch (err) {
                console.error("Auth initialization failed:", err);
                updateStatus('error', 'Auth Failed');
            }
        }

        document.getElementById('add-btn').addEventListener('click', addTask);
        input.addEventListener('keypress', (e) => { 
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                addTask(); 
            }
        });

        // Start Auth loop on window.onload
        window.onload = () => {
            const cached = localStorage.getItem(`tasks_${currentWorkspace}`);
            if (cached) {
                tasks = JSON.parse(cached);
                renderTasks();
            }
            runAuthenticationFlow();
        };

        // Close modal on outside click
        window.onclick = function(event) {
            const modal = document.getElementById('detail-modal');
            if (event.target == modal) closeModal();
        }
    </script>
</body>
</html>
